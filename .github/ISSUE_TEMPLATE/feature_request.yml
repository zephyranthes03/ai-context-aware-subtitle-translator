name: Feature request / feedback
description: Suggest an improvement or share general feedback
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
      description: Describe the idea and why it would help.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else that would help (screenshots, examples from other tools, etc.)
    validations:
      required: false
